[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holyrics-autoslide"
version = "0.1.0"
description = "Automação inteligente de slides do Holyrics com transcrição de áudio em tempo real e reconhecimento de letras"
authors = [{ name = "Holyrics AutoSlide Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.23.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

